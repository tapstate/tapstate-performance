name: Baseline publication

on:
  pull_request:
  push:
    branches:
      - main
      - 'ws/**'

permissions:
  contents: read

jobs:
  validate:
    name: Verify performance baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test baseline tooling
        run: python3 -B -m unittest discover -s tests
      - name: Verify the operator pages and pinned release references
        run: python3 -B tools/operator_docs.py --check
